name: StudyMate Ollama hybrid evaluation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ollama-eval.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: qwen2.5:3b
      EMBEDDINGS: 'on'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and prepare Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh -o "$RUNNER_TEMP/ollama-install.sh"
          sh "$RUNNER_TEMP/ollama-install.sh"
          if ! curl -fsS http://127.0.0.1:11434/api/tags; then
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          fi
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags
          ollama pull "$OLLAMA_MODEL"
          ollama pull embeddinggemma
          mkdir -p data
          ollama list
      - name: Evaluate original question set with real model
        run: |
          node tools/eval.mjs --llm --embeddings --out evidence/eval-ollama-hybrid.json
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const r=JSON.parse(readFileSync("evidence/eval-ollama-hybrid.json","utf8")); if(r.retrievalMode !== 'hybrid(BM25+embedding)') throw Error('Hybrid retrieval not active'); if(r.llm?.provider !== "ollama:"+process.env.OLLAMA_MODEL || !(r.llm.generators.llm>0)) throw Error("No confirmed model-generated answers"); const {rows,outRows,...summary}=r.llm; console.log(JSON.stringify(summary,null,2));'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studymate-ollama-hybrid-evaluation
          path: evidence/eval-ollama-hybrid.json
          if-no-files-found: warn
