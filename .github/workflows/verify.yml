name: StudyMate verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: 'off'
      EMBEDDINGS: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run eval
      - run: node tools/verify-hybrid.mjs evidence/eval-ollama-hybrid-summary.json
